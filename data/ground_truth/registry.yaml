# =============================================================================
# 検証アンカー台帳(Ground Truth Registry)— V1 / A11
# =============================================================================
# 2026-08-16 新設。docs/plans/external-audit-triage.md §3.2 V1 / §R4 A11
# (「検証アンカー年次更新 + Data Vintage Ledger + Spatial Support Crosswalk」)の実体。
#
# 何のためのファイルか
# --------------------
# `scripts/reality_score.py` が読む**唯一の現実側の源**。スクリプトの中に数値を
# 直書きしない(= 数字が来歴なしで増殖するのを構造的に止める)。
#
# 掟(このファイルに載せてよい数値の条件)
# ----------------------------------------
#  1. **一次統計 or repo 内リサーチ文書の引用値**であること。推定・合成値は
#     `estimate: true` を立て、どう作ったかを `note` に書く(黙って混ぜない)。
#  2. `source` / `year` / `spatial_support` / `denominator` の 4 つが必ず埋まること。
#     埋まらない数値は**載せない**(バンド無し=N/A の方が捏造よりよい)。
#  3. `split` を必ず宣言する。`calibration` = シムの構築・較正にこの表自身を使った
#     アンカー(一致して当然=モデルの性能の証拠にならない)。`holdout` = 構築に
#     使っていないアンカー(こちらだけが予測力の証拠になる)。`diagnostic` =
#     現実側のアンカーが存在しない内部指標(合否ではなく報告のみ)。
#  4. 実在の個人名・商標は書かない(公的機関名・調査名は可)。
#
# 単位の規約: 時刻は 24 時間制の実数時(23:39 = 23.65)。時間量は分/日。
#             割合は 0-1 の実数(パーセントで書かない)。
# =============================================================================

schema_version: 1
updated: "2026-08-16"

# --------------------------------------------------------------------------- #
# Data Vintage Ledger — 「いま入手できる最新版はどれか」を年次で明示する
# --------------------------------------------------------------------------- #
# ★監査(RESOURCE_AWARE / FINAL_DESIGN_GAPS)への回答: 「2026 年の調査を使え」は
#   一般には正しいが、調査によっては**提出時点でこの世に存在しない**。
#   存在しない年次を待つのではなく、「最新版はこれで、次はいつ出るか」を書く。
data_vintage:
  - id: ssb
    name: "社会生活基本調査(総務省統計局)"
    latest_published: "2021 (令和3年)"
    next_wave: "2026年10月 調査実施"
    available_at_submission: false
    note: >-
      5 年周期(2016 → 2021 → 2026)。2026 年調査は 10 月実施で、結果公表は
      2027 年以降。**本選提出時点(2026-08)では 2021 年版が正当な最新**であり、
      2021 を使うことは古い値の使用ではない。COVID 期の上振れ(在宅・巣ごもり)を
      含むことだけは各アンカーの note に明記する。
  - id: nhk_seikatsu_jikan
    name: "NHK 国民生活時間調査"
    latest_published: "2020"
    next_wave: "2025 年調査(結果公表時期は未確認)"
    available_at_submission: false
    note: "5 年周期。2020 年版が repo 内で全文取得済みの最新。"
  - id: iicp_media
    name: "情報通信メディアの利用時間と情報行動に関する調査(総務省情報通信政策研究所)"
    latest_published: "令和7年度 (2026-06 公表・2025 年調査)"
    next_wave: "令和8年度"
    available_at_submission: true
    note: "毎年。**年次更新済み**(旧アンカーの令和2年度=2020 から差し替えた)。"
  - id: tokyo_pt
    name: "東京都市圏パーソントリップ調査"
    latest_published: "第6回 (2018 実施)"
    next_wave: "第7回(実施時期未定)"
    available_at_submission: true
    note: "約 10 年周期。第6回が最新。"
  - id: juminkihon_shibuya
    name: "渋谷区 住民基本台帳 年齢(5歳階級)別男女別人口"
    latest_published: "2026-08-01"
    next_wave: "毎月更新"
    available_at_submission: true
    note: "月次。repo は 2026-08-01 版を scripts/persona_v2.py に取り込み済み。"
  - id: kokusei_2020
    name: "令和2年国勢調査"
    latest_published: "2020"
    next_wave: "令和7年(2025)国勢調査 — 詳細集計は順次公表"
    available_at_submission: true
    note: >-
      2025 国調は速報段階。就業・従業地の**市区町村×属性クロス**は 2020 が最新の
      完全版。本台帳は 2020 を採る。

# --------------------------------------------------------------------------- #
# Spatial Support Crosswalk — 「その数字の分母はどの空間か」
# --------------------------------------------------------------------------- #
# ★同じ「1 人あたり」でも分母の空間が違えば比較にならない。全アンカーは下の
#   いずれかの support を宣言し、レポートに列として出す(黙って混ぜない)。
spatial_support:
  bbox:
    label: "シム範囲(bbox)"
    definition: "lat 35.6505-35.6685 / lon 139.6905-139.7115(約 2.0 x 1.9 km)"
    note: >-
      人流メッシュのコア4メッシュ(53393585/86/95/96)が bbox 南北の約 91% を覆う。
      北端 35.6667-35.6685 の約 200m 帯だけ北スリバー 2 メッシュが担当。
  ward:
    label: "渋谷区"
    definition: "行政区全域(15.11 km2)。夜間人口 243,883(2020 国調)"
    note: "bbox は渋谷区の一部にすぎない(面積比で約 1/4)。人口密度が違うので直接割らない。"
  metro:
    label: "東京都市圏"
    definition: "東京都市圏交通計画協議会の調査対象圏域(1 都 3 県の中心部)"
  tokyo:
    label: "東京都"
    definition: "都全域"
  nation:
    label: "全国"
    definition: "日本全国"

# --------------------------------------------------------------------------- #
# 判定帯(事前登録)— 閾値をコードに埋めずここで宣言する
# --------------------------------------------------------------------------- #
# ★これは文献由来の値ではなく**運用上の取り決め**である(その旨をレポートにも出す)。
#   ok / warn の間は「調律候補」、warn 超は「要説明」。合否ではなく優先度付け。
thresholds:
  jsd:  {ok: 0.05, warn: 0.15, direction: lower_is_better}
  mape: {ok: 0.15, warn: 0.35, direction: lower_is_better}
  ks:   {ok: 0.10, warn: 0.20, direction: lower_is_better}
#: 各アンカーが成立するのに最低限必要な sim 側の標本数。下回ったら **N/A**
#: (小さい標本で出した一致・不一致はどちらも意味を持たない)。
min_samples:
  distribution: 30
  scalar: 20
  curve: 30

