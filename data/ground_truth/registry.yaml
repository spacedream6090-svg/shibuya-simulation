  - id: mob_presence_curve_weekday
    category: mobility
    label: "時刻別 同時滞在人口カーブ(平日)"
    type: curve_file
    metric: jsd
    source_file: "data/jinryu/shibuya_concurrent_144step_curve.csv"
    key_column: "step"
    value_column: "weekday_abs"
    unit: "人(同時滞在)"
    denominator: >-
      コア4メッシュ(53393585/86/95/96)2019 年平均を昼(11-14 時)/深夜(1-4 時)/
      終日の 3 アンカーに拘束し、公表された日内形状で 10 分刻みに内挿した派生系列。
    spatial_support: bbox
    year: "2019"
    source: "国土交通省 全国の人流オープンデータ(1kmメッシュ)を加工して作成"
    url: "https://www.geospatial.jp/ckan/dataset/mlit-1km-fromto"
    provenance: "repo:data/jinryu/SOURCE.md(政府標準利用規約 2.0 = 出典明記で再配布可)"
    split: holdout
    split_basis: >-
      src/society/world/presence.py:16 が「在場実測曲線は v1 では使わない(将来拡張点)」
      と明記している = 構築に使っていない。**在場内生化の予測力の直接の試験**。
    note: >-
      ★絶対人数は比較しない(60 体ランと 37 万人を比べても意味がない)。
      比べるのは**時刻方向の形**(各時刻の構成比に正規化した分布どうしの JSD)。
      値は「滞在時間で按分した換算人口値」= 同時滞在の期待値であって延べ通行量ではない。
    sim_mapping: "enter_area / exit_area から復元した在場区間を時刻帯へ畳んだ人時分布。"

