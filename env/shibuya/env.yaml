# ============================================================
# 環境パック(EnvPack)manifest: 渋谷
#   基盤モデル抽出 D1-W1(docs/plans/foundation-extraction.md の manifest 仕様 +
#   docs/plans/env-classification.md の3層設計)。
#
#   設計原則:
#     ① 共通基盤(src/society)= 機構。場所の知識を持たない。
#     ② 共有参照(ref/institutions_jp.yaml)= 国・都道府県スコープの値。pref セレクタで引く。
#     ③ 環境固有(このパック)= その場所でしか決まらないデータ+値。
#
#   データは **移さず参照**(実体は data/ のまま)。このパックが持つのは
#   「取得レシピ + attribution + パラメータ値」。実体でなく再生成手順を指す(再配布制約の両立)。
#
#   W2 時点では基盤コードは conf/config.yaml の envpack ブロックを読む。W4 の EnvPack ローダが
#   この env.yaml を config キー群へ展開し、`--env env/shibuya` で従来と同一ランを再現する。
# ============================================================
env:
  name: shibuya
  locale: ja-JP
  purpose: production        # demo | experiment | calibration | production(規模/忠実度プリセットの宣言。D2 stage7)

# ---- ③-A 地理層: データ実体は data/ を参照(リポジトリルート相対)。実体でなく取得レシピを注記 ----
data:
  map:            data/shibuya_osm_wide_v7.json          # OSM 実道路網+建物+POI。生成: build_map.py → patch_map.py
  transit:        data/transit_odpt.json                 # 実ダイヤ(メトロ3路線=ODPT・他=公表値近似)。生成: fetch_odpt.py → build_transit_odpt.py
  personas:       data/personas_100_civic.json           # 名簿(公務員入り)。生成: gen_personas.py / build_personas.py
  organizations:  data/organizations_shibuya_wide.json   # 組織台帳(架空・統計準拠)。生成: build_orgs.py
  assignments:    data/org_assignments_100_civic_wide.json
  traffic_features: data/traffic_features_shibuya.json    # 車道注釈(信号/車線/oneway)。生成: build_traffic.py
  sentiment_lexicon: data/sentiment_lexicon.json          # 感情辞書(言語=ja 資産。②側だが同梱=クレジットで再配布可)

# ---- ③-A 原点: 群集・注目の中心(地図ローカル原点=ランドマーク)----
origin:
  landmark: スクランブル交差点
  # 集会ノードは annual.gathering_node が地図原点(0,0)最近傍から機械導出(座標由来=直書きしない)。

# ---- ② 制度: pref セレクタ + ref/institutions_jp.yaml 参照(W3 で economy/government が読む)----
institutions:
  pref: tokyo                                # ref の prefectures.tokyo(最低賃金・住民税配分)を引く
  ref: ../../ref/institutions_jp.yaml
  # 地点固有(都道府県では決まらない値)は env に直書き:
  council:
    size: 9                                  # 議席数(渋谷区議会34議席を100体スケールに圧縮)
    term_days: 1460                          # 任期(区議会4年=地方自治法。ref.national.assembly.term_years×365)
    deposit: 30000                           # 供託金(区議選30万円を所持金スケールに圧縮。ref.national.election より)
  rent_income_ratio: 0.30                    # 家賃=月収比(economy.accounts の家賃引落し)

# ---- ③-B 文化・語彙(棚卸し env-asset-inventory.md の実測値)----
culture:
  lexicon:
    place_name: 渋谷
    underground_name: 地下通路(渋谷ちかみち)
    place_hints:                             # 会話からの場所抽出ヒント(地名固有分。施設語は基盤側)
      - スクランブル交差点
      - スクランブル
      - ハチ公前
      - ハチ公
      - センター街
      - 道玄坂
      - 宮益坂
      - 渋谷駅
      - 渋谷
      - 新宿
      - 原宿
      - 表参道
      - 恵比寿
      - 代官山
  events:                                    # 年中行事(annual_events.enabled で発火)
    - {name: 正月,      month: 1,  day: 1,  crowd: false}
    - {name: ハロウィン, month: 10, day: 31, crowd: true}   # 渋谷固有の群集(集会ノードへ寄せる)
    - {name: 年末,      month: 12, day: 31, crowd: false}
  media:                                     # 娯楽メディアの架空番組名(実在名は使わない=R17)
    tv:    ["夜のスクランブル", "ハチ公前ニュース9", "渋谷トークナイト", "深夜のセンター街劇場", "みんなの気象台"]
    video: ["路地裏グルメ散歩", "10分でわかる都市伝説", "配信者ミナトの日常", "ネオン街ウォーク", "猫と暮らす部屋"]
    game:  ["スクランブル・ラッシュ", "タワー・オブ・シブヤ", "パズル横丁", "ネオンレーサー2", "ハチ公クエスト"]

# ---- ③-A 街頭広告の掲出地点(ads。POI/建物/ノードへ resolve_slots が解決)----
ads:
  large: ["QFRONT", "SHIBUYA 109", "ハチ公前広場"]
  slots: ["渋谷マークシティ"]

# ---- ③-B 自然環境: 月別気候(weather.enabled で発火。現実の東京の月別気候の近似)----
climate:
  monthly:            # 月: [最高気温中心, 最低気温中心, 雨の重み, 雪の重み]
    1:  [10, 2, 0.15, 0.08]
    2:  [11, 2, 0.15, 0.06]
    3:  [15, 6, 0.22, 0.0]
    4:  [20, 10, 0.25, 0.0]
    5:  [24, 14, 0.25, 0.0]
    6:  [26, 18, 0.45, 0.0]
    7:  [30, 23, 0.42, 0.0]
    8:  [32, 25, 0.30, 0.0]
    9:  [27, 20, 0.35, 0.0]
    10: [22, 14, 0.25, 0.0]
    11: [17, 9, 0.20, 0.0]
    12: [12, 4, 0.15, 0.05]
  neutral: [21, 12, 0.22, 0.0]               # calendar OFF(季節なし)時の既定

# ---- ③-A 交通メタ: 対象駅名フィルタ(GTFS 実ダイヤ抽出用)----
transit:
  station_filters: ["渋谷", "Shibuya"]
  lines:                                     # 参考(9路線。ODPT 由来)
    - JR山手線
    - JR埼京線
    - JR湘南新宿ライン
    - 東急東横線
    - 東急田園都市線
    - 京王井の頭線
    - 東京メトロ銀座線
    - 東京メトロ半蔵門線
    - 東京メトロ副都心線

# ---- attribution(出典表示。共有時の権利両立)----
attribution:
  - "地図: © OpenStreetMap contributors(ODbL)。実体 data/shibuya_osm*.json は再生成レシピ(build_map.py/patch_map.py)で取得する。"
  - "交通ダイヤ: 公共交通オープンデータセンター(ODPT)のデータを加工して作成。実行時 API は使わず静的キャッシュ(data/odpt/)のみを読む規律。免責は data/odpt/_index.json に従う。"
  - "人口・名簿: 令和2年国勢調査 渋谷区(e-Stat)を基に IPF で合成(個票ではない架空名簿)。"
  - "感情辞書: 東北大学 乾・岡崎研究室 日本語評価極性辞書(クレジット明記で商用/再配布可)。"

notes: |
  このパックは「データ実体でなく取得レシピ」を指す設計(foundation-extraction.md §リスクと整合)。
  map/transit の再生成は scripts/build_map.py・patch_map.py・fetch_odpt.py・build_transit_odpt.py を参照。
  地名・語彙・行事・気候・番組名は conf/config.yaml の envpack ブロック(W2 で新設)と同値。
  W4 の EnvPack ローダがこの env.yaml をそれらの config キーへ展開し、単一の場所定義から
  同一ランを再現できるようにする(profile と同じ重ね書き機構を再利用)。
