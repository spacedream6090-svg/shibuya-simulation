# ============================================================
# 環境パック(EnvPack)manifest: shimokita
#   自動生成 v0(scripts/make_env.py・D2)。3層設計は docs/plans/env-classification.md。
#   ③-A 地理は data/ 実体を参照(移さず取得レシピを指す)。②制度は pref セレクタで ref から引く。
# ============================================================
env:
  name: shimokita
  locale: ja-JP
  purpose: experiment        # demo | experiment | calibration | production

# ---- ③-A 地理層(実体は --out 配下。map は必須)----
data:
  map:            env/shimokita/map.json    # OSM 実道路網+建物+POI。生成: scripts/make_env.py(build_map)
  personas:       env/shimokita/personas_shimokita.json    # 渋谷名簿の機械的縮小流用(v0 手動テンプレ)

# ---- ③-A 原点: 群集・注目の中心(地図ローカル原点)----
origin:
  landmark: ""                # 原点モード=bbox-center(ランドマーク未指定=(0,0)最近傍を集会ノードに)

# ---- ③-B 文化・語彙(v0: 地名のみ機械設定。行事/番組名は base 既定=generic に縮退)----
culture:
  lexicon:
    place_name: 下北沢
    underground_name: 地下通路

# ---- ② 制度: pref セレクタ + ref/institutions_jp.yaml(W4 ローダが展開)----
institutions:
  pref: tokyo                    # ref.prefectures.tokyo(最低賃金・住民税配分)を引く
  ref: ../../ref/institutions_jp.yaml
  # 地点固有(都道府県では決まらない値)は必要に応じ council/rent_income_ratio を追記:
  # council: {size: 9, term_days: 1460, deposit: 30000}
  # rent_income_ratio: 0.30

# ---- attribution(出典表示。共有時の権利両立)----
attribution:
  - "地図: © OpenStreetMap contributors(ODbL)。実体は再生成レシピ(scripts/make_env.py / build_map.py)で取得する。"

notes: |
  scripts/make_env.py(v0 半自動)で生成。地理は自動、personas/orgs/制度は手動テンプレ(TODO.md 参照)。
  bbox(S,W,N,E)=[35.6595, 139.666, 35.663, 139.67]。取得統計・縮退の明示は env_report.md を参照。
